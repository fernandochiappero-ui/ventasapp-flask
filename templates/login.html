{% extends "base.html" %}
{% block titulo %}VERDULERIA EL GAUCHITO{% endblock %}
{% block contenido %}
<div class="login-envoltorio">
  <div class="login-caja">
    <div class="marca">VERDULERIA EL <span>GAUCHITO</span></div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="mensaje {{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="tarjeta">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="ancho verde">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
