{% extends "base.html" %}
{% block titulo %}Registrar movimiento{% endblock %}
{% block contenido %}
<h1>Registrar movimiento</h1>
<form method="POST" class="tarjeta">
  <label for="monto">Importe *</label><input id="monto" type="number" name="monto" min="0.01" step="0.01" required>
  <label for="concepto">Concepto *</label><input id="concepto" name="concepto" maxlength="300" required>
  <label for="categoria">Categoría *</label><select id="categoria" name="categoria" required><option value="retiro">Retiro</option><option value="gasto">Gasto</option></select>
  <label for="forma_pago">Forma de pago *</label><select id="forma_pago" name="forma_pago" required><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="otro">Otro</option></select>
  <label for="observaciones">Observaciones</label><input id="observaciones" name="observaciones" maxlength="500">
  <button class="ancho verde">Registrar movimiento</button>
</form>
{% endblock %}
