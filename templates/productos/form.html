{% extends "base.html" %}
{% block titulo %}Agregar producto{% endblock %}
{% block contenido %}
<h1>Agregar producto al almacén</h1>

<form method="POST" class="tarjeta formulario-producto">
  <label for="codigo">Código</label>
  <input type="text" id="codigo" name="codigo" maxlength="40"
         value="{{ request.form.get('codigo', '') }}" placeholder="Código de barras o interno">

  <label for="nombre">Producto *</label>
  <input type="text" id="nombre" name="nombre" maxlength="150"
         value="{{ request.form.get('nombre', '') }}" required autofocus>

  <label for="categoria">Categoría</label>
  <input type="text" id="categoria" name="categoria" maxlength="100"
         value="{{ request.form.get('categoria', '') }}" placeholder="Ej.: bebidas, limpieza">

  <label for="descripcion">Descripción</label>
  <textarea id="descripcion" name="descripcion" maxlength="300">{{ request.form.get('descripcion', '') }}</textarea>

  <div class="campos-producto-numericos">
    <div>
      <label for="stock">Stock inicial *</label>
      <input type="number" id="stock" name="stock" min="0" step="0.001"
             value="{{ request.form.get('stock', '0') }}" required>
    </div>
    <div>
      <label for="precio_costo">Precio de costo *</label>
      <input type="number" id="precio_costo" name="precio_costo" min="0" step="0.01"
             value="{{ request.form.get('precio_costo', '0') }}" required>
    </div>
    <div>
      <label for="precio_venta">Precio de venta *</label>
      <input type="number" id="precio_venta" name="precio_venta" min="0" step="0.01"
             value="{{ request.form.get('precio_venta', '0') }}" required>
    </div>
  </div>

  <button type="submit" class="ancho verde">Guardar producto</button>
</form>
{% endblock %}
